standard:
  description: "Define the VHDL revision to use for parsing and analysis with the standard key. The expected value is the year associated the VHDL standard. Defining the standard feature is a relatively new feature (since april 2024). Anything but the 2008 standard will not change much at the moment."
  type: select
  options:
    v1993: "1993"
    v2008: "2008"
    v2019: "2019"
  value: "v2008"

ignoreVunit:
  description: "It will ignore the VUnit library in vunit_lib."
  type: boolean
  value: false

vunitPath:
  description: "Path to the VUnit files. Example: '/home/myuser/.venvs/default/lib/python3.12/site-packages/vunit/vhdl/**/*.vhd'"
  type: string
  value: ""

ignoreUnisim:
  description: "Mark the UNISIM library as third-party so diagnostics in the library sources are ignored."
  type: boolean
  value: true

unisimPath:
  description: "Path glob to the Vivado UNISIM VHDL files. Example: '/tools/Xilinx/Vivado/2025.1/data/vhdl/src/unisims/**/*.vhd'"
  type: string
  value: ""

ignoreXpm:
  description: "Mark the XPM library as third-party so diagnostics in the library sources are ignored."
  type: boolean
  value: true

xpmPath:
  description: "Path glob to the Vivado XPM VHDL files. Example: '/tools/Xilinx/Vivado/2025.1/data/ip/xpm/**/*.vhd'"
  type: string
  value: ""
